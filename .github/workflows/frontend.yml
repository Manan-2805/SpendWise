name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'app/**'
      - 'alembic/**'
      - 'docs/openapi.json'
      - 'docs/api-contract.md'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - 'docker-compose*.yml'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/**'
      - 'alembic/**'
      - 'docs/openapi.json'
      - 'docs/api-contract.md'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - 'docker-compose*.yml'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make frontend-install frontend-check
      - run: npm audit --prefix frontend
      - run: npm --prefix frontend run api:generate && git diff --exit-code -- frontend/src/lib/api/generated.ts
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: make frontend-e2e
      - run: docker build -f frontend/Dockerfile frontend
