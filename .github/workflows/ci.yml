name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: make install
      - run: make pre-commit-run
        env:
          # The path-filtered frontend workflow runs the new frontend hook’s checks.
          SKIP: frontend-check
      - run: make build
