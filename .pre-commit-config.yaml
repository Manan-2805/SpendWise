repos:
  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  # Basic file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  # Ruff lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Mypy
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        pass_filenames: false

  # Tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: make test
        language: system
        pass_filenames: false

  # Security scan
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: make security-check
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: make audit
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: frontend-check
        name: frontend check
        entry: make frontend-check
        language: system
        files: ^frontend/
        pass_filenames: false
