# PostgreSQL and Redis are provisioned independently on private networks.
x-runtime: &runtime
  image: ${SPENDWISE_IMAGE:-spendwise:latest}
  environment: &runtime-env
    ENVIRONMENT: production
    DEBUG: "false"
    GRANIAN_BACKPRESSURE: ${GRANIAN_BACKPRESSURE:-512}
    MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-16}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
    DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-0.25}
    LOGIN_BCRYPT_CONCURRENCY: ${LOGIN_BCRYPT_CONCURRENCY:-1}
    OVERLOAD_RETRY_AFTER_SECONDS: ${OVERLOAD_RETRY_AFTER_SECONDS:-1}
    READINESS_INTERVAL_SECONDS: ${READINESS_INTERVAL_SECONDS:-2}
    READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-0.2}
    READINESS_MAX_AGE_SECONDS: ${READINESS_MAX_AGE_SECONDS:-6}
    DATABASE_URL: ${SPENDWISE_DATABASE_URL:?Provide a least-privilege runtime database URL}
    REDIS_URL: ${SPENDWISE_REDIS_URL:?Provide the authenticated Redis cache URL}
    CELERY_BROKER_URL: ${SPENDWISE_CELERY_BROKER_URL:?Provide the authenticated Redis broker URL}
    CELERY_RESULT_BACKEND: ${SPENDWISE_CELERY_RESULT_BACKEND:?Provide the authenticated result backend URL}
    SECRET_KEY: ${SPENDWISE_SECRET_KEY:?Provide a generated signing key}
    CORS_ORIGINS: ${SPENDWISE_CORS_ORIGINS:-[]}
    TRUSTED_HOSTS: ${SPENDWISE_TRUSTED_HOSTS:-[]}
    FRONTEND_URL: ${SPENDWISE_FRONTEND_URL:?Provide the HTTPS frontend URL}
    SMTP_HOST: ${SPENDWISE_SMTP_HOST:-}
    SMTP_PORT: ${SPENDWISE_SMTP_PORT:-587}
    SMTP_USERNAME: ${SPENDWISE_SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SPENDWISE_SMTP_PASSWORD:-}
    SMTP_FROM: ${SPENDWISE_SMTP_FROM:-}
  restart: unless-stopped

services:
  migrate:
    <<: *runtime
    profiles: ["migrate"]
    environment:
      <<: *runtime-env
      DATABASE_URL: ${SPENDWISE_MIGRATION_DATABASE_URL:-}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  web:
    <<: *runtime
    ports:
      - "127.0.0.1:8000:8000"

  celery_worker:
    <<: *runtime
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    healthcheck:
      disable: true

  celery_beat:
    <<: *runtime
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/var/lib/spendwise/celerybeat-schedule"]
    volumes:
      - beat_data:/var/lib/spendwise
    healthcheck:
      disable: true

volumes:
  beat_data:
