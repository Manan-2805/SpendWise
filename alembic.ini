# alembic.ini

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for migration file names
# %(year)d%(month).2d%(day).2d_%(rev)s_%(slug)s — date prefix for ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Leave blank — the URL is set programmatically in alembic/env.py
# Never put the real connection string here (it would be committed to git)
sqlalchemy.url =

[post_write_hooks]
# Run ruff on newly generated migration files
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S