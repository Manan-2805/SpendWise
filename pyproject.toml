[project]
name = "spendwise"
version = "1.0.0"
description = "Personal expense tracker API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "celery>=5.6.3,<6.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3,<1.0",
    "flower>=2.0.1",
    "granian>=2.7.5",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.30",
    "redis>=8.0.0,<9.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.50,<3.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=23.0.0",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0",
    "coredis>=6.7.0",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-instrumentation-redis>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "factory-boy>=3.3.3",
    "faker>=40.19.1",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "types-authlib>=1.6.11.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific improvements
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
              # (FastAPI uses this pattern with Depends())
    "RUF022", # allow unsorted imports in __init__.py files for better package organization
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "flower.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.worker.tasks",
    "app.worker.celery_app",
]
disallow_untyped_decorators = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "-ra",             # Show short summary of all non-passing tests
]

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
