x-api: &api
  build:
    context: .
    dockerfile: ${LOCAL_DOCKERFILE:-docker/Dockerfile.dev}
  environment:
    ENVIRONMENT: development
    DEBUG: ${DEBUG:-true}
    GRANIAN_BACKPRESSURE: ${GRANIAN_BACKPRESSURE:-512}
    MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-16}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
    DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-0.25}
    LOGIN_BCRYPT_CONCURRENCY: ${LOGIN_BCRYPT_CONCURRENCY:-1}
    OVERLOAD_RETRY_AFTER_SECONDS: ${OVERLOAD_RETRY_AFTER_SECONDS:-1}
    READINESS_INTERVAL_SECONDS: ${READINESS_INTERVAL_SECONDS:-2}
    READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-0.2}
    READINESS_MAX_AGE_SECONDS: ${READINESS_MAX_AGE_SECONDS:-6}
    DATABASE_URL: postgresql://spendwise:spendwise_dev_password@postgres:5432/spendwise
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    SECRET_KEY: ${SECRET_KEY:?Run make install before starting the development stack}
    FRONTEND_URL: ${SPENDWISE_DEV_FRONTEND_URL:-http://localhost:3000}
    SMTP_HOST: ${SPENDWISE_DEV_SMTP_HOST:-mailpit}
    SMTP_PORT: ${SPENDWISE_DEV_SMTP_PORT:-1025}
    SMTP_FROM: ${SPENDWISE_DEV_SMTP_FROM:-notifications@spendwise.test}
    SMTP_USERNAME: ${SPENDWISE_DEV_SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SPENDWISE_DEV_SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SPENDWISE_DEV_SMTP_STARTTLS:-false}
  volumes:
    - ./app:/app/app:ro
    - ./alembic:/app/alembic:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spendwise", "-d", "spendwise", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./scripts:/app/scripts:ro
    networks:
      default:
        aliases: [web]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    profiles: ["frontend"]
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "100"
    tmpfs:
      - /tmp

  worker:
    <<: *api
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
