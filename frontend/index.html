<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SpendWise</title>
    <script>
      (() => {
        let theme = 'system'
        try { theme = localStorage.getItem('theme') || theme } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
    <style>
      html { color-scheme: light; background: #e9f2fb; color: #172338 }
      html.dark { color-scheme: dark; background: #101c2d; color: #e6f4fc }
      body { margin: 0 }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; font: 600 18px system-ui, sans-serif }
      .boot-screen span { display: grid; justify-items: center; gap: 12px }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><span><img src="/ledger.svg" width="52" height="52" alt="" />Loading SpendWise…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
