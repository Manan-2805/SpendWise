services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendwise_test
      POSTGRES_USER: spendwise_test
      POSTGRES_PASSWORD: spendwise_test_local
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spendwise_test", "-d", "spendwise_test", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
